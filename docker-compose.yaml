services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  # Watchdog + Qdrant writer. No torch, no CUDA, no model:
  # vectors are requested over HTTP from `api`.
  embedder:
    build: ./embedder
    container_name: embedder
    restart: always
    volumes:
      - ./data:/data:rw
    depends_on:
      - qdrant
      - api
    environment:
      - API_URL=http://api:8000
      - WATCH_PATH=/data/documents
      - DEBOUNCE_SEC=1.0
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    mem_limit: 1g

  # The single owner of the embedding model (fp16 on GPU).
  api:
    build: ./api
    container_name: api
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"   # debug only (Swagger at /docs) - agents talk to gateway
    volumes:
      - ./models:/models:rw          # also the HF cache (HF_HOME below)
    depends_on:
      - qdrant
    environment:
      - MODEL_PATH=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - HF_HOME=/models/hf-cache
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - EMBEDDING_DTYPE=${EMBEDDING_DTYPE:-float16}
      - EMBEDDING_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
      # Имя retrieval-промпта модели для запросов (Qwen3-Embedding: "query").
      # Пусто - кодировать запросы без инструкции, как документы.
      - EMBEDDING_QUERY_PROMPT=${EMBEDDING_QUERY_PROMPT:-query}
      # Ограничение длины входа в токенах (32k у модели; чанки и запросы короче)
      - EMBEDDING_MAX_SEQ_LENGTH=${EMBEDDING_MAX_SEQ_LENGTH:-8192}
      - EMBEDDING_MODEL_NAME=rag-embeddings
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=documents
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  # The only service agents need to talk to: OpenAI-compatible API with RAG.
  # Base URL: http://localhost:8001/v1
  #
  # The LLM itself lives behind UPSTREAM_BASE_URL - a self-hosted
  # OpenAI-compatible server (vLLM / LM Studio / llama.cpp), usually on another
  # machine. UPSTREAM_API_KEY stays inside this container and is never exposed
  # to agents.
  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - api
    environment:
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - UPSTREAM_HEADERS=${UPSTREAM_HEADERS:-}
      - API_URL=http://api:8000
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.5}
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Comma-separated bearer tokens. Empty = authentication disabled.
      - API_KEYS=${API_KEYS:-}
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
