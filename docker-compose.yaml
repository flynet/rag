services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.1}
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      # A named volume lives on ext4 inside the Docker Desktop VM. A bind mount from
      # Windows goes through a 9p translation layer: Qdrant warns "cannot guarantee
      # data safety" there and its WAL gets corrupted, so snapshots taken on a
      # bind-mounted storage contain a broken first-index.
      - qdrant_data:/qdrant/storage
      # REST snapshots (`POST /collections/{name}/snapshots`) are written to
      # /qdrant/snapshots, which is NOT inside the storage dir. Bind it so node
      # snapshots survive container recreation, and keep the downloaded copies
      # in ./backups as the portable artifact.
      - ./qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      # The official image is debian-slim and has no curl/wget. Bash's
      # /dev/tcp is enough to confirm that the HTTP port accepts connections.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Watchdog + Qdrant writer. No torch, no CUDA, no model:
  # vectors are requested over HTTP from `api`.
  embedder:
    build: ./embedder
    container_name: embedder
    restart: always
    volumes:
      - ./data:/data:rw
    depends_on:
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - WATCH_PATH=/data/documents
      - DEBOUNCE_SEC=1.0
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    mem_limit: 1g

  # The single owner of the embedding model (fp16 on GPU).
  api:
    build: ./api
    container_name: api
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"   # debug only (Swagger at /docs) - agents talk to gateway
    volumes:
      - ./models:/models:rw          # also the HF cache (HF_HOME below)
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - MODEL_PATH=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - HF_HOME=/models/hf-cache
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - EMBEDDING_DTYPE=${EMBEDDING_DTYPE:-float16}
      - EMBEDDING_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
      # Retrieval prompt name for queries (Qwen3-Embedding: "query").
      # Empty = encode queries without an instruction, like documents.
      - EMBEDDING_QUERY_PROMPT=${EMBEDDING_QUERY_PROMPT:-query}
      # Input length limit in tokens (the model supports 32k; chunks and queries are shorter).
      - EMBEDDING_MAX_SEQ_LENGTH=${EMBEDDING_MAX_SEQ_LENGTH:-8192}
      - EMBEDDING_MODEL_NAME=rag-embeddings
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=documents
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      # /health returns 200 even while the model is loading, so require the
      # embedder to report "ready" explicitly. The first start may download
      # ~1.2 GB of weights; start_period covers that.
      test:
        - CMD
        - python3
        - -c
        - "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); sys.exit(0 if data.get('embedder') == 'ready' else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m

  # The only service agents need to talk to: OpenAI-compatible API with RAG.
  # Base URL: http://localhost:8001/v1
  #
  # The LLM itself lives behind UPSTREAM_BASE_URL - a self-hosted
  # OpenAI-compatible server (vLLM / LM Studio / llama.cpp), usually on another
  # machine. UPSTREAM_API_KEY stays inside this container and is never exposed
  # to agents.
  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      api:
        # The gateway can start (and degrade) while the model is loading;
        # chat requests still work without retrieval during that window.
        condition: service_started
    environment:
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - UPSTREAM_HEADERS=${UPSTREAM_HEADERS:-}
      - API_URL=http://api:8000
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.5}
      # off | concat | llm - rewrite follow-up questions before retrieval
      - RAG_QUERY_REWRITE=${RAG_QUERY_REWRITE:-off}
      - RAG_REWRITE_HISTORY=${RAG_REWRITE_HISTORY:-3}
      - RAG_REWRITE_TIMEOUT=${RAG_REWRITE_TIMEOUT:-10}
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Comma-separated bearer tokens. Empty = authentication disabled.
      - API_KEYS=${API_KEYS:-}
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Qdrant storage. Created automatically on `docker compose up`, stored on ext4
  # in the Docker Desktop VM. Back it up with `python scripts/qdrant_snapshot.py`.
  qdrant_data:
